; Sin este archivo, PHP usa sus defaults compilados (upload_max_filesize=2M,
; post_max_size=8M), muy por debajo de los límites que Laravel valida
; (galería: imagen 5MB / video 100MB; avances: imagen 5MB / video 50MB).
; Mantener post_max_size > upload_max_filesize (margen para el resto del
; multipart) y ambos por debajo de client_max_body_size de nginx (120M).
upload_max_filesize = 110M
post_max_size = 120M
max_input_time = 300
