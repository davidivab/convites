# Local API stack: app connects to host MySQL (convites / convites_test).
# Frontend lives in a separate repo (Next.js). Ports avoid clashes with other stacks.
name: convites

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    container_name: convites-app
    restart: unless-stopped
    working_dir: /var/www
    env_file:
      - .env
    environment:
      DB_HOST: host.docker.internal
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-convites}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-}
    volumes:
      - ./:/var/www
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - convites

  nginx:
    image: nginx:1.27-alpine
    container_name: convites-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8095}:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - convites

networks:
  convites:
    driver: bridge
